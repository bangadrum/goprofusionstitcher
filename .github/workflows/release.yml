name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Build (release)
        run: swift build -c release

      - name: Package .app bundle
        run: |
          chmod +x ./Scripts/make_app_bundle.sh
          ./Scripts/make_app_bundle.sh

      - name: Zip the app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent "GoPro Fusion Stitcher.app" "GoProFusionStitcher-${{ github.ref_name }}-macOS.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: GoProFusionStitcher-${{ github.ref_name }}-macOS.zip
          generate_release_notes: true
